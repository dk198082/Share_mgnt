name: Azure schema release approvals

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: azure-schema-approval-${{ github.ref }}
  cancel-in-progress: false

jobs:
  schema-approval:
    name: Compare Azure schema before release approval
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: azure-schema-approval
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Require a matching Azure schema
        run: pnpm --filter @workspace/db run azure:schema:check
        env:
          AZURE_PG_HOST: ${{ secrets.AZURE_PG_HOST }}
          AZURE_PG_DATABASE: ${{ secrets.AZURE_PG_DATABASE }}
          AZURE_PG_PORT: ${{ secrets.AZURE_PG_PORT }}
          AZURE_PG_SP_USER: ${{ secrets.AZURE_PG_SP_USER }}
          AZURE_PG_PASSWORD: ${{ secrets.AZURE_PG_PASSWORD }}
          AZURE_PG_SCHEMA: ${{ secrets.AZURE_PG_SCHEMA }}
          AZURE_PG_SSLMODE: ${{ secrets.AZURE_PG_SSLMODE }}
